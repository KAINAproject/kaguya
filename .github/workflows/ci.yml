name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        run: npm install --global pnpm@11.25.0

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve MoonBit dependencies
        run: moon update

      - name: Run MoonBit tests
        run: moon test

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MoonBit TypeScript tooling
        run: pnpm --filter @kaguya/client run setup:types

      - name: Build app
        run: pnpm --filter @kaguya/client run build

      - name: Install Zenoh bridge
        run: |
          archive="$RUNNER_TEMP/zenoh-ts-1.10.1-x86_64-unknown-linux-gnu-standalone.zip"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/eclipse-zenoh/zenoh-ts/releases/download/1.10.1/zenoh-ts-1.10.1-x86_64-unknown-linux-gnu-standalone.zip"
          echo "65a5ed59ba78d1b39da80692c56fddc2dd8879f0feb4a50344f8b9b041b3f559  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/zenoh-ts"
          install -Dm755 \
            "$RUNNER_TEMP/zenoh-ts/zenoh-bridge-remote-api" \
            "$HOME/.local/bin/zenoh-bridge-remote-api"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Playwright browser
        run: pnpm --filter @kaguya/client exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter @kaguya/client run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            apps/client/test-results/
            apps/client/playwright-report/
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm
        run: npm install --global pnpm@11.25.0

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve MoonBit dependencies
        run: moon update

      - name: Run MoonBit tests
        run: moon test

      - name: Install example dependencies
        working-directory: examples/hello-xr
        run: pnpm install --frozen-lockfile

      - name: Install MoonBit TypeScript tooling
        working-directory: examples/hello-xr
        run: pnpm run setup:types

      - name: Build example
        working-directory: examples/hello-xr
        run: pnpm build

      - name: Install Playwright browser
        working-directory: examples/hello-xr
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: examples/hello-xr
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            examples/hello-xr/test-results/
            examples/hello-xr/playwright-report/
          if-no-files-found: ignore
